plugin: gcp_compute

# Caching essential. Without cache, the plugin
# calls google-auth, leaving threads running in the controller; Ansible
# then fork()s a task worker and the Rust bitwarden-sdk segfaults inside it
# ("A worker was found in a dead state"). Serving hosts from cache keeps the
# controller single-threaded.
#
# Refresh after any tofu apply that changes instances:
#   ansible-inventory -i inventory.gcp.yml --list
cache: true
cache_plugin: jsonfile
cache_connection: .ansible/inventory-cache
cache_timeout: 3600
projects:
  - cka-lfs-458
auth_kind: serviceaccount
# Key supplied by TF from BWS
# Path relative to ansible/, where ansible.cfg lives.
service_account_file: .gcp-sa-key.json

filters:
  labels.environment = "cka-lfs458"
  # labels.k8s_role = "control-plane,worker-node"

compose:
  node_name: name
  node_ip_internal: networkInterfaces[0].networkIP
  node_ip_public: networkInterfaces[0].accessConfigs[0].natIP
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP

keyed_groups:
  - key: labels.k8s_role
    prefix: ''

hostnames:
  - name

